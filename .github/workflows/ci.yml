name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Vet
        run: go vet ./...

      - name: Cross-compile
        run: |
          GOOS=windows GOARCH=amd64 go build \
            -ldflags "-H windowsgui -s -w" \
            -o vizlet.exe .
        env:
          CGO_ENABLED: '0'
