name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Test
        run: go test ./...

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4 pinned 2026-07-20

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5 pinned 2026-07-20
        with:
          go-version: '1.22'

      - name: Vet
        run: go vet ./...
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: '0'

      - name: Cross-compile
        run: |
          GOOS=windows GOARCH=amd64 go build \
            -ldflags "-H windowsgui -s -w" \
            -o vizlet.exe .
        env:
          CGO_ENABLED: '0'
